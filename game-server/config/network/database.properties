#
# ----------------------------
# Database Config's:
# ----------------------------

# This is the database url
# Set the timezone in gameserver.properties if you get an error during startup. It is needed to avoid timestamp errors during daylight savings clock change.
database.url = jdbc:mysql://localhost:3306/aion_gs?serverTimezone=${gameserver.timezone}&characterEncoding=UTF-8

# Database user
database.user = root

# Database password
database.password = 

# Maximal amount of connections kept in connection pool
# 20 leaves room for the Central Market simulation, companions and the in-game web
# windows (Market, Cash Shop, Wardrobe, Season Pass) next to normal player saves.
# With 5, browser requests queued behind the simulation for up to the timeout below.
database.connectionpool.connections.max = 20

# Maximum wait time when getting a DB connection, before throwing a timeout error
database.connectionpool.timeout = 5000