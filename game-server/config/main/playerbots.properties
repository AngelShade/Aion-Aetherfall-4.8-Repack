# Real player companions. PvE only. Commands: .bot help
gameserver.playerbots.enable = true
gameserver.playerbots.max_per_owner = 5
gameserver.playerbots.max_active = 100
gameserver.playerbots.tick_ms = 400
gameserver.playerbots.level_difference = 10
gameserver.playerbots.save_seconds = 120
# .bot create makes a normal level-1 character and consumes an ordinary character slot.
# .bot generate makes a companion at your level in a separate persistent roster.
# The separate roster requires sql/playerbots.sql applied before server startup.
gameserver.playerbots.generated.enable = true
gameserver.playerbots.generated.max_per_account = 20
# Instance access requires explicit map approval AND registration to the owner's party.
# Keep off until the corresponding instance handlers have been tested with headless players.
gameserver.playerbots.instance_follow = false
gameserver.playerbots.allowed_instance_maps =

# Same-map quest missions walk within this distance of the owner (hard cap 500m).
gameserver.playerbots.mission_distance = 180
