#
# ----------------------------
# Fall damage config's:
# ----------------------------

# Percentage of max HP lost per meter of the fall.
# Default: 1.0 (%)
gameserver.falldamage.percentage = 1.0

# Fixed damage per meter of the fall, added to the percentage.
# Default: 4
gameserver.falldamage.flat = 4

# Fall height above which you take damage.
# Default: 10 (meter)
gameserver.falldamage.distance.minimum = 10

# Fall height from which you die on hitting the ground.
# Default: 50 (meter)
gameserver.falldamage.distance.maximum = 50

# Fall height after which you die in mid air when there is no ground within reach.
# Default: 50 (meter)
gameserver.falldamage.distance.midair = 50

# Same as above, inside a fly zone.
# Default: 100 (meter)
gameserver.falldamage.distance.midair.flyzone = 100
