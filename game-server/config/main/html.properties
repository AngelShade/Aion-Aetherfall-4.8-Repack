#
# ----------------------------
# HTML config's:
# ----------------------------

# Enable HTML welcome message
# Default: false
gameserver.html.welcome.enable = false

# Enable HTML Guides system
# Default: false
gameserver.html.guides.enable = false

# Html files directory
# Default: ./data/static_data/HTML/
gameserver.html.root = ./data/static_data/HTML/

# Html cache directory
# Default: ./cache/html.cache
gameserver.html.cache.file = ./cache/html.cache

# Encoding
# Default: UTF-8
gameserver.html.encoding = UTF-8
# Text size of the custom windows (Companions, Account, Season Pass, Wardrobe, markets) in percent.
# Small text is raised most; 0 keeps the original stylesheet sizes.
# Default: 100
gameserver.html.window.text.scale = 100

# Codex item and creature drop database, opened from the Central Market's Codex tab.
# Default: true
gameserver.html.codex.enabled = true
