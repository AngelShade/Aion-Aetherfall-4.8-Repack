# Supply and demand for solo/small servers. This is separate from the NPC Broker.
gameserver.central.market.simulation.enabled = true
# Economic activity scale, not a count of connected characters.
gameserver.central.market.simulation.population = 3000
gameserver.central.market.simulation.tick_seconds = 5
gameserver.central.market.simulation.catalog_batch = 2000
# Quotes rotate at different times; expensive asks and low bids can wait for a match.
gameserver.central.market.simulation.refresh_min_seconds = 120
gameserver.central.market.simulation.refresh_max_seconds = 480
gameserver.central.market.simulation.max_stack = 100
# Simulated sellers occupy spaced levels across the whole current price range.
# Stackable stock is shared between these levels; non-stackable items have one per level.
gameserver.central.market.simulation.price_levels = 7
# Per scheduled refresh, chance of a bid reaching the bottom/top price of the range.
# Intermediate prices interpolate between them. Competing sellers share finite demand.
# Opening/browsing the market does not reroll demand.
gameserver.central.market.simulation.low_price_demand_percent = 80
gameserver.central.market.simulation.high_price_demand_percent = 10
