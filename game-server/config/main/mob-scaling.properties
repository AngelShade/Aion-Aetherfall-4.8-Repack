# Open-world monster difficulty. Changes apply after a normal GameServer restart.
# Instanced maps (including solo/personal instances) are ALWAYS excluded.
# MONSTER / RAID_MONSTER templates are eligible, plus older untyped templates
# whose native base tribe is MONSTER and which are not player-friendly/dialog
# NPCs. Summons, pets, guards, doors, artifacts and siege actors stay native.
# Difficulty HP is excluded from native XP calculation; reward rates stay native.
gameserver.mob.scaling.enable = true

# Solo baseline relative to the mob's existing native stats.
# Damage is added through the native PvE attack ratio: 1.25 = +250 per mille.
# It combines with normal PvE bonuses/defenses; fixed/template-exempt damage
# retains native exemptions. Skills and basic attacks use the same PvE channel.
gameserver.mob.scaling.hp_multiplier = 2.0
gameserver.mob.scaling.damage_multiplier = 1.25

gameserver.mob.scaling.ratings = JUNK,NORMAL,ELITE,HERO,LEGENDARY
gameserver.mob.scaling.excluded_maps =
gameserver.mob.scaling.excluded_npcs =

# Count nearby native parties OR full alliances (not just their
# six-player subgroup). Human players and playerbots count equally. Only living,
# spawned members in this map/channel within member_radius of the mob count.
# Pets do not add members; their attacks are attributed to their player master.
# All eligible mobs within this radius adjust before combat, including bot-only
# parties/alliances. Separate unallied teams are not combined: the largest local
# team count wins. Idle mobs shrink again when the group leaves; an active fight
# retains its highest count until reset. Current HP percentage is preserved.
# Native movement/spawn/roster/life events coalesce local spatial-region work.
# No world/population scan, global repeating task or timer per mob/player.
# Existing actors receive a small native HP update without despawn/respawn.
gameserver.mob.scaling.group.enable = true
gameserver.mob.scaling.group.member_radius = 100
# Minimum 1000ms, maximum 60000ms; events in the same region share one task.
gameserver.mob.scaling.group.update_interval = 1000

# multiplier = min(cap, solo_baseline * (1 + per_member * (members - 1)))
# Includes the solo player in members. These increases apply to each additional
# nearby party/alliance member, up to the native 24-player alliance limit.
# Examples with these settings: 1 = 2x HP / +25% PvE damage, 6 = 7x / +56.25%,
# 12 = 13x / +93.75%, 24 = 25x / +168.75%. Values are relative to native baseline.
# During an increase, native max-HP handling preserves the current HP fraction.
gameserver.mob.scaling.group.hp_per_member = 0.5
gameserver.mob.scaling.group.damage_per_member = 0.05
gameserver.mob.scaling.group.max_members = 24
gameserver.mob.scaling.group.max_hp_multiplier = 30.0
gameserver.mob.scaling.group.max_damage_multiplier = 4.0
