# Supply each faction's broker with every eligible, tradeable item template.
# Reserved seller characters (IDs 999901-999906) must exist in the game database.
gameserver.broker.market.enabled = true
# Add listings in paced batches while the game server stays available.
gameserver.broker.market.max_items_per_refill = 2000
gameserver.broker.market.catchup_interval_seconds = 15
gameserver.broker.market.max_stack = 100
# Applied to the configured vendor purchase price or upgrade-material price floor,
# whichever is higher, with a 10% listing variation.
gameserver.broker.market.price_multiplier = 1.0
# Each subsequent refill is scheduled independently within this interval.
gameserver.broker.market.refill_min_minutes = 30
gameserver.broker.market.refill_max_minutes = 90
