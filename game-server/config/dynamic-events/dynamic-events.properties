# Dynamic events: chains a Road Warden starts when it needs help (config/dynamic-events/README.md).
# Chain stories, stages and narration live in config/dynamic-events/chains/*.json.
# The rules follow Guild Wars 2's dynamic events: they run whether or not anyone is there,
# their outcome changes the road, they scale with the crowd, and everyone who helps is paid.

# Master switch. false stops new events; running ones finish their current stage and end.
gameserver.dynamicevents.enable = true

# Chance (0-100) that a Warden seeing a player of its faction starts an event, per check.
gameserver.dynamicevents.trigger_chance_percent = 20

# Seconds between trigger checks of one Warden (minimum 10).
gameserver.dynamicevents.trigger_check_seconds = 30

# Events running at once on the whole server (scheduled events count too).
gameserver.dynamicevents.max_running = 4

# Events running at once on one map.
gameserver.dynamicevents.max_per_map = 1

# Minutes a Warden beat waits after its event ended before it can start another.
gameserver.dynamicevents.beat_cooldown_minutes = 45

# Metres around the event's current spot in which players and bots take part.
gameserver.dynamicevents.radius = 60

# How much one bot counts toward event scaling, in percent of a player.
gameserver.dynamicevents.bot_weight_percent = 50

# Metres around the event in which free world bots hear the call for help.
gameserver.dynamicevents.bot_recruit_range = 120

# World bots that answer one event's call at most.
gameserver.dynamicevents.bot_recruit_max = 4

# Participants a normal stage scales for at most (Guild Wars 2: most events scale for up to 10).
gameserver.dynamicevents.scale_cap_players = 10

# Participants a [Group Event] stage and the boss scale for at most.
gameserver.dynamicevents.group_scale_cap_players = 40

# From this many participants, some arriving raiders are Elites (10% more per participant, at most half).
gameserver.dynamicevents.elite_from_players = 5

# Extra boss health per participant beyond the first, in percent of its native health.
gameserver.dynamicevents.boss_hp_per_participant_percent = 35

# Cap on the boss's health from event scaling, in percent of its native health.
gameserver.dynamicevents.boss_hp_max_percent = 500

# Contribution share of the top contributor needed for Gold, in percent.
gameserver.dynamicevents.gold_share_percent = 50

# Contribution share of the top contributor needed for Silver, in percent (anything above 0 is Bronze).
gameserver.dynamicevents.silver_share_percent = 20

# XP for each finished part at Gold, in per mille of a level (Guild Wars 2: 7% of the event level's XP).
gameserver.dynamicevents.stage_xp_permille = 70

# Kinah for each finished part at Gold, per level of the reward.
gameserver.dynamicevents.kinah_per_level = 120

# Silver pays this percent of Gold (Guild Wars 2: 85).
gameserver.dynamicevents.silver_reward_percent = 85

# Bronze pays this percent of Gold (Guild Wars 2: 75).
gameserver.dynamicevents.bronze_reward_percent = 75

# A failed part pays this percent of its tier's reward (Guild Wars 2: half the XP and coin).
gameserver.dynamicevents.failed_reward_percent = 50

# Players this many levels or more away from the event's level earn no event reward (Guild Wars 2: 10).
gameserver.dynamicevents.reward_level_gap = 10

# Daily boss chest, once per character per chain per day: Kinah per level.
gameserver.dynamicevents.chest_kinah_per_level = 1000

# Daily boss chest: Recruitment Tickets (0 switches them off).
gameserver.dynamicevents.chest_tickets = 1

# Daily bonus chest, once per account per day: Recruitment Tickets when the leader's native drops hold no rare gear.
gameserver.dynamicevents.bonus_chest_tickets = 2

# Minutes the raiders hold a road after a failed event, unless players retake it first.
gameserver.dynamicevents.occupation_minutes = 240

# Raiders that stand guard on a held road.
gameserver.dynamicevents.occupation_holders = 5

# Minutes a native merchant keeps a stall at the event after a won chain (0 switches it off).
gameserver.dynamicevents.shop_minutes = 10
