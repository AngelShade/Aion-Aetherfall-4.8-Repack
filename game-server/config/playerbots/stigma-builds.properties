# Selectable Stigma builds for Temporary Bots (Player Companions > Equipment > Build choices).
# Each build lists Stigma skill groups (item_templates.xml <stigma gain_skill_group1>) in priority order. The bot
# equips the first ones that fit its unlocked regular and advanced Stigma slots and its race; free slots fall back to
# the automatic role scoring. Picks follow common Aion 4.x community builds for each class and were checked against
# this server's Stigma list. Owned alts are never changed.
# enabled=false hides the choice and keeps automatic Stigmas for every bot.
enabled=true

