# Selectable Stigma builds for Temporary Bots (Player Companions > Equipment > Build choices).
# Four strategies per advanced class. Each lists Stigma skill groups (item_templates.xml <stigma gain_skill_group1>) in
# priority order. The bot equips the first ones that its level, unlocked slots and race allow, so one list is staged by
# the native stone levels: 20 (three slots to 44), then 45 and 55. Free slots fall back to the automatic role scoring.
# <class>.<key>.weapon is optional: the weapon a build's stones require, used only while the bot's weapon choice is AUTO.
# Every listed stone is castable by PlayerBotSkills on the build's weapon. Stones it cannot cast yet are left out:
# traps, summoned totems and servants, summoned ice or wind areas, dash and hide skills, self-provoker buffs such as
# Blessing of Wind and Apply Lethal Venom, and one-time boosts. Add them to a build only with a native adapter.
# At level 55 the first six stones also pick the Vision skill (StigmaService.getLinkedStigmaLearnSkill): a class's major stone
# plus exactly two of its three matching stones, or else the class default. Keep each build on a Vision the AI can cast.
# Picks follow the class's native stones and common Aion 4.x play; combat strength has not been measured. Owned alts are
# never changed. enabled=false hides the choice and keeps automatic Stigmas for every bot.
enabled=true

