# Population behavior from mod-playerbots 037c014 / RandomBotLevelMgr.
# Only generated GLOBAL world bots participate. Owned alts and manual pools do not.
# Native equivalent of PlayerbotGuildMgr / InitGuild. No existing membership is
# moved or deleted. Native names, factions, legion capacity and SQL custody apply.
gameserver.playerbots.management.legions.enable = true
gameserver.playerbots.management.legions.count = 20
gameserver.playerbots.management.legions.max_members = 15
# Owner enabled the two optional upstream managers; upstream ships them disabled.
gameserver.playerbots.management.brackets.enable = true
gameserver.playerbots.management.reset.enable = true

# Native camp/zone preference with worldwide fallback, matching the donor.
# False restores the separately configurable Aion strict player-focus extension.
gameserver.playerbots.management.upstream_placement = true
# Donor admissions shuffle eligible characters and apply the configured faction ratio
# per batch. False restores the older Aion least-represented-level admission extension.
gameserver.playerbots.management.upstream_admission = true
gameserver.playerbots.management.refresh.enable = true
gameserver.playerbots.management.refresh.min_seconds = 7200
gameserver.playerbots.management.refresh.max_seconds = 1209600
gameserver.playerbots.management.downgrade_max_level = false
gameserver.playerbots.management.fixed_levels = false
# Follow actual native queue demand and accept matched invitations through the
# normal Aion service, respecting level, tickets, cooldowns and registration times.
gameserver.playerbots.management.native_queues.enable = true
gameserver.playerbots.management.revive.min_seconds = 60
gameserver.playerbots.management.revive.max_seconds = 300
gameserver.playerbots.management.disabled_without_players = false
gameserver.playerbots.management.player_login_delay_seconds = 30
gameserver.playerbots.management.player_logout_delay_seconds = 300

# Per-faction percentages; WoW default bands are clamped to native 1..65.
# Invalid bands receive zero weight; remaining enabled bands are rebalanced to 100.
gameserver.playerbots.management.brackets.elyos = 1-9:12,10-19:11,20-29:11,30-39:11,40-49:11,50-59:11,60-69:11,70-79:11,80-80:11
gameserver.playerbots.management.brackets.asmodians = 1-9:12,10-19:11,20-29:11,30-39:11,40-49:11,50-59:11,60-69:11,70-79:11,80-80:11
gameserver.playerbots.management.brackets.check_seconds = 300
gameserver.playerbots.management.brackets.pending_check_seconds = 15
gameserver.playerbots.management.brackets.process_limit = 5
gameserver.playerbots.management.brackets.dynamic = false
gameserver.playerbots.management.brackets.sync_factions = false
gameserver.playerbots.management.brackets.real_player_weight = 1.0
gameserver.playerbots.management.brackets.protect_friends = true
gameserver.playerbots.management.brackets.protect_legions = true
gameserver.playerbots.management.brackets.exclude_names =

# Generated world bots may be rebuilt at a new level, including gear, skills,
# Stigmas and quests. Identity/name/appearance and native custody remain intact.
gameserver.playerbots.management.reset.max_level = 65
gameserver.playerbots.management.reset.to_level = 1
gameserver.playerbots.management.reset.skip_from_level = 0
gameserver.playerbots.management.reset.skip_to_level = 1
gameserver.playerbots.management.reset.chance = 100
gameserver.playerbots.management.reset.scaled_chance = false
gameserver.playerbots.management.reset.restrict_played_time = false
gameserver.playerbots.management.reset.min_played_seconds = 86400
gameserver.playerbots.management.reset.played_check_seconds = 864
gameserver.playerbots.management.reset.protect_legions = false
gameserver.playerbots.management.reset.exclude_names =

# Revival and moves without a reload (7 Nov live session: 3,895 saved-character loads in 7 hours).
# true: a revived bot is teleported live to its next camp, and a moved bot only refills its consumables.
# false: the old path saves, unloads and loads the character again after every revival and move.
gameserver.playerbots.management.move_in_place = true
# Offscreen quest turn-ins. A sleeping bot (no human on its map) with a finished ordinary quest moves unseen
# to the reward NPC, when no human is on that map either, and turns it in through the native reward dialog.
# This replaces the most common cross-map walk. false: finished quests wait until the bot is awake.
gameserver.playerbots.management.offscreen_turn_ins = true
# Camp safety. Native grind camps are monster spawn points, so a bot teleported onto one lands inside the pack.
# A landing or a sleeping spot is unsafe within an aggressive monster's aggro range plus margin metres when the
# monster's level (elite and stronger +5) is at least the bot's level minus level_below. Unsafe camps land at a
# 15-45 m standoff instead, and a bot about to go dormant on unsafe ground moves to the nearest safe camp first.
gameserver.playerbots.management.camp_safety.enable = true
gameserver.playerbots.management.camp_safety.margin = 10
gameserver.playerbots.management.camp_safety.level_below = 6
# A bot falling asleep on an empty map first moves to the nearest service point of its own
# faction (vendor, warehouse or teleporter: towns and outposts with guards), as players log off
# somewhere safe. Nobody is on the map to see it. Monsters respawning on a grind camp were
# killing sleeping bots (134 an hour on 8 Nov). false = only leave spots the danger index flags.
gameserver.playerbots.management.camp_safety.park_in_hubs = true
# Camp death memory, RAM only: limit deaths in one 20 m cell and 5-level band within window_seconds close the
# cell to that band for avoid_seconds.
gameserver.playerbots.management.camp_deaths.limit = 2
gameserver.playerbots.management.camp_deaths.window_seconds = 3600
gameserver.playerbots.management.camp_deaths.avoid_seconds = 86400
