# PLAYERBOTS FEATURE SWITCHES
# Independent native Find Group posts and party/whisper conversation. Each world
# bot posts for a real current objective or an accessible level-appropriate XP run.
# Per faction/tab ceiling; never changes population, quests or companion AI.
gameserver.playerbots.social.findgroup = true
# Maximum world-bot Find Group posts displayed in each recruitment tab.
gameserver.playerbots.social.findgroup.posts_per_tab = 12
# Dungeon runs listed in Instance Groups per faction at the same time (1..60).
gameserver.playerbots.social.findgroup.instance_posts = 20

# Bots on any map may post dungeon runs; whoever joins gets them summoned (they meet
# at the entrance). False keeps dungeon posts to bots near an entrance on a player map.
gameserver.playerbots.social.findgroup.remote_instances = true
# Joining a bot's dungeon run tells you the dungeon, its named bosses and what it can pay;
# each named boss is announced as it falls, and the final boss shows the Recruitment Tickets
# the run paid (or why it paid none). false = silent runs, rewards unchanged.
gameserver.playerbots.social.findgroup.run_briefing = true
# How many bot help requests you can have at once (1-3). Each shows as its own quest in the
# journal and tracker, with its own buttons and reward.
gameserver.playerbots.social.findgroup.help_max_active = 3
# Some bots are the type to drop you right before they hand their quest in and keep the
# credit, as players do. Percent of world bots with that trait (fixed for life, PvP-leaning
# bots twice as likely, questers half). 0 = none.
gameserver.playerbots.social.findgroup.help_kick_scoundrel_percent = 15
# Chance such a bot really does it once its quest objectives are done: a cheeky party line,
# then a kick if it leads or it leaves alone. No reward for that help. 0 = never.
gameserver.playerbots.social.findgroup.help_kick_percent = 40
# Bots answer your own Find Group posts: a bot with the role your party lacks whispers
# an offer, or a forming bot group offers you an invite. At most one offer per post
# type every 3 minutes per player.
gameserver.playerbots.social.findgroup.offers = true

# Name-addressed chat requests use native legion invitations and rank permissions.
gameserver.playerbots.social.legion_invites = true
# Per physical lift/instance. Excess world travellers choose another activity.
# Passenger count is a ceiling; body-sized supported space can admit fewer.
gameserver.playerbots.navigation.platform.queue_limit = 8
# Allow bots to ride native moving platforms as passengers.
gameserver.playerbots.navigation.platform.passengers = 4

# Recruited companions mirror the owner's glide, including road/ground launches.
# Native movement, collision, character flight eligibility and FP rules remain.
gameserver.playerbots.companion.glide_follow = true

# Companion follow only: maximum catch-up speed relative to the faster of the
# companion's native speed and its leader. Eases down within 9 m of its role slot,
# including after the leader stops. 1 disables the extra catch-up acceleration.
# Does not speed up combat, forced movement, jumps or moving-platform rides.
gameserver.playerbots.companion.catchup_multiplier = 4

# Try ordinary walking/jumping first. If a nearby companion is still following
# but has made no physical progress for this many milliseconds, regroup it using
# native summon placement. Combat, casts, roots, interactions and active transport
# do not count as stuck following. 0 disables only this nearby recovery;
# the existing 60 m distance recall remains available.
gameserver.playerbots.companion.stuck_recall_ms = 5000

# All new autonomous quest feature switches live in this one file.
# Edit the copy in the GameServer installation you start, then restart GameServer.
# config/mygs.properties remains the final override. Existing population, companion
# and budget settings in config/playerbots/playerbots.properties keep their current values.
# Disabling a feature stops new AI actions; it does not erase saved quests, characters,
# professions, recipes, items or progress. Native work already started finishes or
# cancels safely, and a bot already in flight retains its safe arrival/landing.

# Master quest automation for independent world bots and quest-enabled companions.
# False leaves normal combat, loot, following and earned progression available.
gameserver.playerbots.quests.enable = true

# Accept eligible quests using an actual owned quest-start item.
# False still permits use of owned items required by an already accepted quest.
gameserver.playerbots.quests.item_starts = true

# Execute reviewed native custom/campaign quest conversations and objectives.
# Native prerequisites, dialog pages, skill requirements and rewards still apply.
gameserver.playerbots.quests.custom = true

# Learn eligible professions/recipes, perform real work orders and qualification
# crafting, and use native tools/materials/costs. False stops new crafting decisions.
gameserver.playerbots.quests.crafting = true

# Obtain missing quest/crafting materials from legal vendors, native monster drops
# and gathering nodes. All purchases obey the bot's saved reserve and daily budget.
gameserver.playerbots.quests.materials = true

# Use native relic/fountain exchanges when the bot owns the actual required offering.
# False stops new exchanges; no offering is fabricated or removed by this switch.
gameserver.playerbots.quests.exchange = true

# Initiate quest scripted flights and permitted free flight for material gathering.
# Native flight permissions, flight points, geometry and arrival/landing rules apply.
# Ground routes remain available when false; existing flight completion stays safe.
gameserver.playerbots.quests.flight = true

# Autonomous world bots act only while a human player is in the same map AND
# instance. With no humans there, they finish combat/native actions safely, stop
# moving/planning/crafting/buffing and retain their characters and earned progress.
# Companions and player-controlled world bots continue serving their owners.
# False restores autonomous activity on unoccupied maps as well.
gameserver.playerbots.world.only_occupied_maps = true

# Shared human-presence refresh in milliseconds (100..10000). This controls how
# promptly maps wake/sleep after login, logout or teleport, including instances.
# A single observation serves every bot; this does not scan players per bot.
gameserver.playerbots.world.presence_refresh_ms = 1000

# Level of detail inside an occupied map (Phase 2). Bots a human can see run
# at full detail, and so do bots in combat, dead, casting, trading, looting,
# flying, in an instance or in a human's party. Everyone else on the map keeps
# doing the same work out of sight, with fewer idle decisions and no upgrade-hunt
# search. Bots on maps without humans stay dormant as before.
# False restores map-wide full detail.
gameserver.playerbots.world.detail_tiers = true
# Out-of-view buffer: bots within this many metres of a human (120..400) also run
# at full detail. Humans see about 95 m, so the buffer covers their approach.
gameserver.playerbots.world.detail.visible_radius = 200
# A buffer bot keeps full detail until it is this far away (hysteresis, up to 500).
gameserver.playerbots.world.detail.visible_leave_radius = 250
# Most buffer bots per human (0..120); bots the human can actually see never count.
gameserver.playerbots.world.detail.visible_per_human = 30
# Out of sight, idle decisions come this many times less often (1..10, capped at 20 s).
gameserver.playerbots.world.detail.near_reaction_multiplier = 3
# Out of sight, a walking bot checks its path every this many ms (200..2000; native 200).
gameserver.playerbots.world.detail.near_moving_ms = 600
# Share of out-of-sight bots (0..100%) that still run at full detail, picked by a
# fixed per-bot hash, as upstream BotActiveAlone.
gameserver.playerbots.world.detail.rotation_percent = 10
# The rotating share is re-picked every this many seconds (at least 5).
gameserver.playerbots.world.detail.rotation_seconds = 30
# SmartScale: at or below this average decision lag (ms) the full rotating share runs.
gameserver.playerbots.world.detail.smartscale_floor_ms = 50
# SmartScale: at or above this average decision lag (ms) the rotating share is 0.
# Visible and forced bots are never throttled.
gameserver.playerbots.world.detail.smartscale_ceiling_ms = 200
# Bots in the legion of a human on the same map always run at full detail.
gameserver.playerbots.world.detail.legion_force = true

# Independent bots with no useful quest/combat/service job may walk to nearby
# visible, friendly service NPCs and make short visits. Native pathfinding,
# interaction range, visibility and destination visitor limits still apply.
# False disables these optional visits; legitimate town waiting is not a failed route.
gameserver.playerbots.world.rpg.enable = true

# NPC visit pause after actual arrival, in milliseconds (1000..60000).
# Quests, combat, recovery and useful services keep their normal priorities.
gameserver.playerbots.world.rpg_pause_ms = 10000

# Tank pull command (.bot pull): the tank tags the selected monster, from range
# when it has a ready ranged single-target skill, and walks it back to where the
# owner stood; the rest of the party waits there. False disables the command.
gameserver.playerbots.tank.pull.enable = true
# Skills at least this long (metres) count as ranged pulls.
gameserver.playerbots.tank.pull.ranged_range = 10
# Give up a pull not tagged within this time, and stop walking back after this time (ms).
gameserver.playerbots.tank.pull.reach_ms = 25000
# Maximum time in milliseconds for the tank to return a tagged pull to the owner.
gameserver.playerbots.tank.pull.return_ms = 8000

# Tanks gather loose enemies (in the fight but not on the tank) with area taunt or
# area threat skills even when area attacks are off; uninvolved, sleeping and
# crowd-control-marked monsters still block those skills.
gameserver.playerbots.tank.area_threat.enable = true
# Loose enemies needed before area threat is preferred (minimum 2).
gameserver.playerbots.tank.area_threat.min_loose = 2

# Owner target marks (.bot mark kill|cc|clear): kill = party focus target,
# cc = nobody damages it and a companion keeps it asleep, paralysed or feared.
gameserver.playerbots.marks.enable = true
# A crowd-control mark left uncontrolled this long while hostile is released (ms).
gameserver.playerbots.marks.cc_release_ms = 8000

# Follow the client's native party/alliance marks: numbered icons 1-6 in order,
# then the team leader's eligible target, then normal party defence. Existing
# explicit attack orders and .bot kill marks keep priority. The native Zzz mark
# is never attacked, even alone; clear it before attacking or pulling that NPC.
# False restores the previous command-only marking behaviour.
gameserver.playerbots.marks.native.enable = true

# Native road careers for generated world residents. Existing owned alts are excluded.
# Deterministic allocation: 24% Wardens, 12% Merchants, subject to suitable roads and levels.
# Wardens walk long field beats, join regional companies and offer free road aid and a daily bounty.
# Careers without beat capacity remain ordinary field reserves and retry every five minutes.
# Warden services, spacing, titles and timers live in road-wardens.properties; beats in warden-beats.tsv.
# Merchant prices, ranks, stock and shop ranges live in road-merchants.properties.
# All career/progress data is SQL-backed.
gameserver.playerbots.road_duty.enable = true

# WORLD BOT TRAITS
# Companion collection Renown has its own historical ledger and benefits only ticket recruits.
# Working base weights for permanent Poor, Ordinary, Good, Great and Excellent gear rarity.
# Existing human-account Renown is a separate subject and is never included.
gameserver.playerbots.collection.renown.enable = true
# Renown weights for collected ticket recruits of Poor, Ordinary, Good, Great and Excellent rarity.
gameserver.playerbots.collection.renown.rarity_weights = 10,25,50,100,200

# Weights for Poor, Ordinary, Good, Great and Excellent, used separately for gear rarity and combat rank.
# A world bot draws once at its first full rebuild and keeps the result.
gameserver.playerbots.world.trait_weights = 4354,2854,1854,554,384

# Hiring, recycling, the bot market, world bot goals and the help contract are in economy.properties.

# RECRUITMENT TICKETS
# Leave off until game-server/sql/playerbot_recruitment.sql is applied. Pays earned tickets and opens the ticket recruitment route.
gameserver.playerbots.tickets.enable = true
# One-time account-shared starter tickets, credited on the first ticket transaction.
# Existing accounts also receive this once; balances are added to, never reset.
# 0 disables grants. Changing the amount never grants it again to a credited account.
gameserver.playerbots.tickets.starting = 50
# A run's challenge is native scaled boss HP x damage, divided by party strength per player slot.
# Tickets paid per account: below challenge_one 0, then 1, 2 and 3 at these challenge values.
gameserver.playerbots.tickets.challenge_one = 0.60
# Minimum native run challenge required to award two recruitment tickets per account.
gameserver.playerbots.tickets.challenge_two = 1.10
# Minimum native run challenge required to award three recruitment tickets per account.
gameserver.playerbots.tickets.challenge_three = 1.60
# Journey continuation goals. Chapters read real play and pay no tickets.
gameserver.playerbots.journey.tickets_goal = 1
# Completed runs required for the Journey continuation goal.
gameserver.playerbots.journey.runs_goal = 5
# Completed help contracts required for the Journey continuation goal.
gameserver.playerbots.journey.help_goal = 1
# One title for the first three chapters and one for all of them. 0 pays none. Title ids from player_titles.xml.
gameserver.playerbots.journey.midpoint_title = 101
# Native title ID awarded for completing every Journey chapter; 0 disables the title.
gameserver.playerbots.journey.final_title = 102
# Flat tickets for a PvP win, which has no boss to measure.
gameserver.playerbots.tickets.pvp_win = 1
# Member strength per level above or below the final boss, and its limits.
gameserver.playerbots.tickets.level_step = 0.1
# Minimum member-strength multiplier after adjustment for level relative to the final boss.
gameserver.playerbots.tickets.level_min = 0.25
# Maximum member-strength multiplier after adjustment for level relative to the final boss.
gameserver.playerbots.tickets.level_max = 2.0
# Limits on equipment score against the expected ordinary score for that class and level.
gameserver.playerbots.tickets.gear_min = 0.5
# Maximum equipment-strength multiplier relative to ordinary gear for the class and level.
gameserver.playerbots.tickets.gear_max = 1.5

# Minimum spacing between tactical traps, totems, servants and summoned areas (milliseconds).
# Native costs, cooldowns and summon lifetimes still apply; no idle deployments.
gameserver.playerbots.skills.deploy_interval_ms = 10000
# Reserve cooldowns this long for durable enemies, player fights or emergencies (seconds).
gameserver.playerbots.skills.long_cooldown_seconds = 180

# A free world bot passing a player of its faction joins the fight when the monster is elite or tougher,
# or the player's health is low. Its hits leave the kill and its rewards with the player.
gameserver.playerbots.bystanders.enable = true
# How close the bot must be to the player (metres).
gameserver.playerbots.bystanders.range = 30
# Below this health, even an ordinary monster brings help (percent).
gameserver.playerbots.bystanders.health_percent = 70
# At most this many bots join one player at a time.
gameserver.playerbots.bystanders.max_per_player = 2

# Let nearby players hear short updates about what companions and world bots are doing.
gameserver.playerbots.chat.activity.enable = true
# Minimum time between one bot's activity updates (seconds).
gameserver.playerbots.chat.activity.cooldown_seconds = 90
# Time before a bot can mention the same ongoing activity again (seconds).
gameserver.playerbots.chat.activity.reminder_seconds = 180
# Maximum activity updates each player hears from all bots in any sixty seconds.
gameserver.playerbots.chat.activity.human_cap_per_minute = 4
