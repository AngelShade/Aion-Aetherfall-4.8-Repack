# PLAYERBOTS: FACTION FIGHTS, RIFTS AND WHERE BOTS APPEAR
# Edit this file in the GameServer folder you actually start, then restart it.
# true = on, false = off. Distances are metres. Percentages are from 0 to 100.
# config/mygs.properties can override the values here.
# These settings never change a character's level, equipment, quests or ownership.

# Allow bots to fight enemy players, enemy bots and their pets where Aion allows
# PvP. Companions defend their party and assist its attacks; Passive still means
# no attacks. false turns off all bot PvP, including self-defence and rift trips.
gameserver.playerbots.pvp.enable = true

# Share of nearby encounters in which independent bots may START a fight (0..100).
# 0 = defend/assist only. 100 = every bot may start a suitable fight.
# Each bot/enemy pair has a stable choice, not another dice roll every second.
# Players and bots are judged the same way. Attacking a bot/its allies can still
# provoke a response. A bot busy fighting monsters will not start another fight.
gameserver.playerbots.pvp.start_fights_percent = 35

# How close an unprovoked enemy must be before a bot considers starting a fight.
gameserver.playerbots.pvp.notice_distance = 24
# Stop pursuit beyond this distance from where the fight began. Companions also
# stay within their normal 45 m limit around their owner and obey Guard/Stay.
gameserver.playerbots.pvp.chase_distance = 60
# Maximum uninterrupted pursuit. After this, take a 15-second break from starting
# another fight; fresh attacks can still be answered. Helps prevent endless chasing.
gameserver.playerbots.pvp.chase_seconds = 25
# Do not START fights against enemies this many levels above OR below the bot.
# 8 means a level 40 bot considers levels 32..48. Self-defence has no level limit.
gameserver.playerbots.pvp.level_difference = 8
# Compare nearby living allies with nearby enemies before starting a fight.
# 1.5 allows enemies estimated up to 50% stronger. Lower = more cautious.
# This uses visible levels/health/numbers, not secret player information.
gameserver.playerbots.pvp.enemy_strength_limit = 1.5
# Avoid joining a fight when this many allies already target the same enemy.
# Direct defence and explicit owner attack orders can exceed this soft limit.
gameserver.playerbots.pvp.attackers_per_target = 3
# Below this health %, prefer healing/protection and retreating over pursuit.
gameserver.playerbots.pvp.retreat_health_percent = 25

# RIFT TRIPS: independent bots walk to a real OPEN rift and use its normal rules.
# No portals are created and no entry levels are bypassed. Questing continues
# between trips and in enemy territory. Companions follow their human owner.
# Parties made entirely of independent bots follow their leader to the same rift;
# each member must physically reach it and have an entry available.
gameserver.playerbots.pvp.rifts.enable = true
# Fresh chance per eligible independent leader's attempt. 0 disables new trips.
# Followers still follow their all-bot leader; this is not a fixed character pool.
gameserver.playerbots.pvp.rifts.participants_percent = 15
# Minimum break between attempts; each bot adds a random delay up to this long
# again, so they do not all set off together. Timers are saved in the database.
gameserver.playerbots.pvp.rifts.rest_minutes = 20
# How long a visitor is protected from automatic population relocation. Afterward
# the normal unseen/out-of-combat population rules can return it to its side.
# This is not a timed teleport and never yanks a visible fighter out of battle.
gameserver.playerbots.pvp.rifts.visit_minutes = 10
# Only plan a trip to an open rift within this walking distance on the same map.
gameserver.playerbots.pvp.rifts.search_distance = 1200
# Give up a blocked/closed rift trip after this many seconds and resume normal work.
gameserver.playerbots.pvp.rifts.travel_seconds = 180
# Keep the matching opposing homeland active when a player is on its counterpart
# map. This lets enemies quest and reach rifts on their side before invading.
# false saves work on empty maps, but those bots cannot walk to invasion rifts.
# Only used while player presence is off; invaders_per_rift below works either way.
gameserver.playerbots.pvp.rifts.keep_home_map_awake = true
# Most independent bots that one open rift sends into a homeland where a player
# is. They set off from their own empty homeland, so nobody sees them leave, walk
# into the real rift and arrive through its exit. 0 = only the chance trips above.
gameserver.playerbots.pvp.rifts.invaders_per_rift = 4

# BOT LEANINGS: each independent bot keeps one lifelong leaning, picked once from
# these weights (name:weight) and saved. PVP bots travel to fights; the other
# leanings will steer quests, hunting, trade work and market trading.
gameserver.playerbots.pvp.leaning_weights = QUESTER:35,HUNTER:20,TRADE:15,TRADER:10,PVP:20
# From level 10 a bot's favoured activity comes round this share of the usual wait (10..100):
# hunters hunt, TRADE bots work their trade and TRADERs visit the market that much more often,
# and questers wait that much longer between gear hunts. 100 = leanings do not change pacing.
gameserver.playerbots.pvp.leaning_focus_percent = 40
# A PVP leaning only starts to matter from this level (1..65).
gameserver.playerbots.pvp.leaning_min_level = 20
# On shared maps (the Abyss and other maps both factions use), keep up to this
# many enemy PVP bots within seek_distance of each player. They arrive unseen at
# their own faction's camps and walk in. 0 = only bots already living there.
gameserver.playerbots.pvp.shared_enemies_per_human = 6
# Those enemies are within this many levels of the player (0..20).
gameserver.playerbots.pvp.shared_level_range = 5
# PVP bots on shared maps and on their own homeland (where any enemy came through
# a rift), and bots visiting through a rift, walk toward the nearest enemy within
# this distance who is not standing by guards hostile to them.
gameserver.playerbots.pvp.seek_distance = 1000
# Chance that a bot plays a victory emote after defeating an enemy player or bot.
gameserver.playerbots.pvp.victory_emote_percent = 40

# DUELS: bots answer your duel requests through the normal duel window after a moment.
# A free, healthy bot salutes and accepts, otherwise it shakes its head; it then really
# fights you, celebrates a win or thanks you after losing. false = bots decline every duel.
gameserver.playerbots.pvp.duels.enable = true
# Chance (0..100) that an ordinary bot accepts; PVP-leaning bots always accept when free.
gameserver.playerbots.pvp.duels.accept_percent = 70
# A bot standing beside you may ask you for a duel, at most once per this many minutes
# per player. 0 = bots never ask.
gameserver.playerbots.pvp.duels.challenge_minutes = 30
# Beating a bot in a duel pays your level times this much Kinah (level 30: 4,500). 0 = none.
gameserver.playerbots.pvp.duels.reward_kinah_per_level = 150
# ...and this many Abyss Points, shown like any other AP gain. 0 = none.
gameserver.playerbots.pvp.duels.reward_ap = 25
# At most this many paid duels a day per account; the same bot pays you once per 30 minutes.
gameserver.playerbots.pvp.duels.rewards_per_day = 10

# BATTLEGROUNDS AND ARENAS (Dredgion, Kamar, Ophidan Bridge, Iron Wall, Idgel Dome and the
# arenas): bots that joined with you hunt whoever the game says is an enemy anywhere in the
# instance and always start the fight. false = they only fight back.
gameserver.playerbots.pvp.battlegrounds.enable = true
# Inside those instances bots also attack hostile objective NPCs within reach (each map scores
# them itself). Separate from the line above: false keeps the player fights only.
gameserver.playerbots.pvp.battlegrounds.objectives = true
# DREDGION: in Baranath, Chantra and Terath Dredgion, bots that do not lean PvP play the map:
# the Surkana worth most for the walk (one you are attacking first), hatches and the officers
# that open the captain's deck, and the captain only when killing it wins for their side. Each
# new target is called out once in team chat. PvP-leaning bots keep hunting players.
gameserver.playerbots.pvp.battlegrounds.dredgion = true
# KAMAR BATTLEFIELD: bots take kills and supplies, the capture points (each spawns your
# flag) and the commander only when its 3,500 points win the run.
gameserver.playerbots.pvp.battlegrounds.kamar = true
# ENGULFED OPHIDAN BRIDGE: bots fight the Balaur and capture enemy or Balaur power
# generators (5,000 points each).
gameserver.playerbots.pvp.battlegrounds.ophidan = true
# IRON WALL WARFRONT: bots take generators, the roaming boss, supplies and capture points,
# and Pashid only when his 30,000 points win the run.
gameserver.playerbots.pvp.battlegrounds.iron_wall = true
# IDGEL DOME: bots fight the arena guards and take Kunax only when his 6,000 points win it.
gameserver.playerbots.pvp.battlegrounds.idgel = true
# ARENAS (Chaos, Discipline, Harmony, Glory and their training grounds): when no opponent is
# near, bots use the arena's relics, flame throwers and floor shifters and fight its monsters
# for points. Opponents and rounds stay as they are.
gameserver.playerbots.pvp.battlegrounds.arenas = true

# SIEGES: while a fortress, artifact or outpost siege runs, bots attack enemy siege NPCs within
# reach (gates, guardians, the lord) and PVP bots on that map walk to the siege, on either side.
gameserver.playerbots.pvp.sieges.enable = true
# A running Agent fight (Veille against Mastarius) draws every bot on its map to it, not
# only the PvP-leaning ones. false = PvP-leaning bots only, as for other sieges.
gameserver.playerbots.pvp.sieges.agent_all_bots = true

# BASES: PVP bots attack the NPCs of a base their faction does not hold (killing its boss captures
# it) and now and then walk to the nearest such base. Ordinary bots leave base guards alone.
gameserver.playerbots.pvp.bases.enable = true
# A PVP bot sets off for an enemy-held base at most once per this many minutes (1..1440).
gameserver.playerbots.pvp.bases.trip_minutes = 30

# POPULATION PLACEMENT: affects independent world bots, never summoned companions.
# Start on the faction's own homeland. On shared maps, start on its side of the
# native service camps. Enemies reach your homeland by travelling through rifts.
gameserver.playerbots.population.faction_home_spawns = true
# Never create/relocate a world bot this close to a human player (minimum 150).
# Raising it makes sudden appearances less likely, but leaves fewer safe camps.
gameserver.playerbots.population.unseen_spawn_distance = 200
# On shared maps, also keep starting camps this far from opposing service camps.
# Larger values leave more empty space between faction starting areas.
gameserver.playerbots.population.enemy_camp_distance = 150
