# ROAD MERCHANT MODULE
# Server-wide settings for travelling merchant bots. Restart the game server after editing.
# gameserver.playerbots.road_duty.enable in features.properties turns road careers on or off.

# PRICES
# Price = item level^4 / level_divisor * quality multiplier * rank percent * scale percent.
# Example: a level 30 orange from a Master is 30^4 / 6 * 80 * 135% = about 14.6 million Kinah.
# Scale every merchant price at once: 50 = half price, 200 = double price.
gameserver.playerbots.merchants.price.scale_percent = 100
# Lower divides by less, so prices rise. Minimum 1.
gameserver.playerbots.merchants.price.level_divisor = 6
# Lowest and highest price of any single item, in Kinah.
gameserver.playerbots.merchants.price.minimum = 1000
gameserver.playerbots.merchants.price.maximum = 999999999999
# House goods on Oriel and Pernon are all level 1, so they price as this base times the quality
# multiplier below, or their native price if that is higher. Rank and scale still apply.
gameserver.playerbots.merchants.price.house_base = 10000

# Multiplier for each item quality.
gameserver.playerbots.merchants.price.quality.common = 5
gameserver.playerbots.merchants.price.quality.green = 10
gameserver.playerbots.merchants.price.quality.blue = 20
gameserver.playerbots.merchants.price.quality.gold = 40
gameserver.playerbots.merchants.price.quality.orange = 80
gameserver.playerbots.merchants.price.quality.purple = 150

# Surcharge for each merchant rank, in percent. 100 = no surcharge.
gameserver.playerbots.merchants.price.rank.peddler_percent = 100
gameserver.playerbots.merchants.price.rank.trader_percent = 110
gameserver.playerbots.merchants.price.rank.specialist_percent = 120
gameserver.playerbots.merchants.price.rank.master_percent = 135
gameserver.playerbots.merchants.price.rank.legendary_percent = 150

# RANKS
# Best item quality each rank sells: 2 green, 3 blue, 4 gold, 5 orange, 6 purple.
gameserver.playerbots.merchants.rank.max_quality.peddler = 2
gameserver.playerbots.merchants.rank.max_quality.trader = 3
gameserver.playerbots.merchants.rank.max_quality.specialist = 4
gameserver.playerbots.merchants.rank.max_quality.master = 5
gameserver.playerbots.merchants.rank.max_quality.legendary = 6

# Rank odds out of the total of these five values. Keep at least one above 0.
# Applies to newly assigned merchants; a merchant keeps the rank it already rolled.
gameserver.playerbots.merchants.rank.chance.peddler = 6000
gameserver.playerbots.merchants.rank.chance.trader = 2500
gameserver.playerbots.merchants.rank.chance.specialist = 1000
gameserver.playerbots.merchants.rank.chance.master = 400
gameserver.playerbots.merchants.rank.chance.legendary = 100

# STOCK
# Items held = base + per_rank for each rank above Peddler. Defaults give 20, 21, 22, 23 and 24.
# Stock comes from the instances of the merchant's map, then its own monsters, and needs free bag space.
gameserver.playerbots.merchants.stock.base = 20
gameserver.playerbots.merchants.stock.per_rank = 1
# Hours between restocks, and how many items each restock step adds.
gameserver.playerbots.merchants.stock.restock_hours = 6
gameserver.playerbots.merchants.stock.restock_items = 6

# SHOP
# Items sent to a shop. The client splits them across its own pages, 10 per page.
# Below the stock size, the rest appears on the next opening.
gameserver.playerbots.merchants.shop.max_listed = 24
# Metres at which a traveller makes the merchant stop and open its shop.
gameserver.playerbots.merchants.shop.open_range = 8
# Metres at which the shop closes and buying stops.
gameserver.playerbots.merchants.shop.close_range = 15
