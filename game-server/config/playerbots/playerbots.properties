# Player companions and independent world bots. Commands: .bot help / .bot worldstats.
# All settings load at GameServer startup. Restart after editing this file.
# Running installation: target-deploy/game-server/config/playerbots/playerbots.properties.
# Maintained template: game-server/config/playerbots/playerbots.properties.
# Existing runtime values take precedence over Java @Property defaultValue fallbacks.

# MASTER SWITCH AND PLAYER COMPANIONS
# Master switch for both companions and world bots. False prevents recruitment
# and safely saves/dismisses active bots through the existing shutdown lifecycle.
gameserver.playerbots.enable = true
# Enables manual individual/team Summon commands and menu buttons. Native combat,
# ownership, team, map, casting, trade, loot and item-use checks still apply.
# Automatic map following, distant recall and wipe recovery are separate.
gameserver.playerbots.summon.enable = true
# Active controlled companions per player: 0-23 (native alliance has 24 total members).
# Values above 5 let a full ordinary party expand into an alliance on recruitment.
# Human members consume native slots; special/automatic teams are not converted.
gameserver.playerbots.max_per_owner = 23
# Server-wide limit for active PLAYER-CONTROLLED companions across all owners.
# This does not set the independent world-bot population; use world.max_active.
gameserver.playerbots.max_active = 100
# Maximum scheduler wait in milliseconds, clamped to 25-400. Per-bot reaction
# deadlines remain separate; this is not a spawn interval or a forced AI tick rate.
gameserver.playerbots.tick_ms = 400
# Largest absolute level difference allowed when recruiting your offline ordinary
# account characters. Generated Temporary Bots use their separate matching rules.
gameserver.playerbots.level_difference = 10
# Periodic full-character checkpoint interval in seconds; minimum 30.
# Saves are staggered, one character per callback. Dismissal/shutdown saves remain.
gameserver.playerbots.save_seconds = 120

# SAVED TEMPORARY BOTS AND OWNED CHARACTERS
# Enables creation of generated Temporary Bots in the separate persistent roster
# (.bot generate / menu). Normal .bot create uses ordinary account character slots.
# The separate roster requires sql/playerbots.sql applied before server startup.
gameserver.playerbots.generated.enable = true
# Maximum saved Temporary Bots per account; 0 disables new saved creations.
# Independent of active team capacity: full teams keep new bots in the roster.
# Pending creations count. Lowering it never deletes existing characters.
# Also sizes manual world-pool accounts and global account shards (global: 1-100).
gameserver.playerbots.generated.max_per_account = 20
# Legacy compatibility setting; currently has no effect on recruitment/following.
# Owner/native instance admission is authoritative, regardless of this value.
gameserver.playerbots.instance_follow = false
# Legacy comma-separated instance-map IDs; currently has no effect. Empty is valid.
# Native owner/map eligibility now decides instance entry rather than this list.
gameserver.playerbots.allowed_instance_maps =
# Maximum same-map quest-mission walking distance from the owner, in metres.
# Clamped to 45-500. This is not the distant automatic recall threshold.
gameserver.playerbots.mission_distance = 180
# Unfinished cosmetic outfit-override feature; keep false for this installed release.
# It does not disable randomized appearance when NEW world characters are created.
# Existing saved appearances remain intact; enabling it does not complete the feature.
gameserver.playerbots.appearance_enabled = false

# INDEPENDENT WORLD BOTS
# Enables the world-bot service, including manual world pools and automatic population.
# The master enable switch above must also be true. Saved identities are retained.
gameserver.playerbots.world.enable = true
# Maximum independent world residents, shared by manual pools and global population.
# Separate from max_active (controlled companions). Installed global policy supports
# population targets up to 3000; raising this alone does not bypass that validation.
gameserver.playerbots.world.max_active = 3000
# Automatically manages a global population without player invitations/manual pools.
# False removes global residents safely; manual pools and saved characters remain.
gameserver.playerbots.population.enable = true
# Minimum randomly chosen GLOBAL active population target. Range 0-3000; <= max.
# Manual pool residents consume world.max_active slots and reduce available capacity.
gameserver.playerbots.population.min = 2800
# Maximum randomly chosen GLOBAL active target. Range min-3000; also bounded by
# world.max_active. This is active population, not the larger persisted reserve.
gameserver.playerbots.population.max = 3000
# Maximum existing candidates admitted per population maintenance pass: 1-120.
# Manager cadence is configured below. Native creation/load is single-flight;
# this is a budget, not a promise of this many immediate spawns per pass.
gameserver.playerbots.population.per_interval = 120
# Normal population-manager interval in seconds (1..3600); default 20 matches WoW.
# At less than 90% of the minimum online target it uses half this interval.
# Initial startup uses 0.5/1 second; native login completion drains its pending batch.
# This does not change combat, movement, healing or companion AI reaction rates.
gameserver.playerbots.population.update_interval_seconds = 20
# Desired Elyos percentage (0-100). ASMODIANS receive the remainder: 100 - this value.
# 50 = 50% Elyos / 50% Asmodians; 30 = 30% / 70%; 0 = all Asmodians; 100 = all Elyos.
# Admissions can use the other faction when eligible candidates are unavailable.
gameserver.playerbots.population.elyos_percent = 50

# INITIAL GLOBAL CHARACTER LEVELS (new server-pool characters only)
# Lowest randomly assigned initial level: 1-65, and <= max_level.
# Saved world characters and player-owned alts are not rerolled by these settings.
gameserver.playerbots.population.min_level = 1
# Highest randomly assigned initial level: min_level-65. Earned progression continues
# normally afterward; this does not permanently prevent a bot from leveling higher.
gameserver.playerbots.population.max_level = 65
# Percentage chance (0-100) to start at exactly min_level when random_levels is true.
# min_level_percent + max_level_percent must not exceed 100.
gameserver.playerbots.population.min_level_percent = 0
# Percentage chance (0-100) to start at the effective maximum level. Remaining rolls
# choose uniformly in the allowed range (so endpoints can also occur in that remainder).
gameserver.playerbots.population.max_level_percent = 0
# True assigns new global characters random initial levels using the range/chances,
# and admits eligible saved characters from the least represented current levels.
# Zero endpoint chances spread NEW characters uniformly across the configured range.
# Admissions retain faction quotas and fill available slots when a level is scarce;
# they never rewrite earned XP/levels. Your character's level is irrelevant unless
# sync_player_levels is explicitly enabled. False assigns starting_level for new
# characters and uses ordinary shuffled saved admissions. Manual pools create at 1.
gameserver.playerbots.population.random_levels = true
# Fixed initial level (1-65) for NEW global characters when random_levels is false.
# Changing it does not reset existing characters or their earned progression.
gameserver.playerbots.population.starting_level = 1
# For random initial levels, cap the effective maximum at highest online non-bot
# player level + 3, within min_level/max_level. Does not rescale existing bots.
gameserver.playerbots.population.sync_player_levels = false

# PRESENCE, PERSISTENT RESERVE AND ACTIVE TARGET TIMING
# True rotates ungrouped residents out after their presence timer, saving progress.
# False keeps residents present until explicit shutdown/disable or geographic demand
# retirement; lowering the random target only stops new admissions in either mode.
# A finite saved pool is provisioned BEFORE automatic login; false uses reserve ratio 1.
gameserver.playerbots.population.periodic_presence = true
# Persistent reserve size multiplier when periodic_presence is true: >1 and <=4.
# Example: max=3000 and ratio=2 builds about 6000 saved characters (rounded to account
# capacity), for at most 3000 active; ratio=4 supports up to 12000 saved characters.
# This does not multiply the active target. Reserved accounts retain existing IDs.
gameserver.playerbots.population.rotation_ratio = 2.0
# Shortest randomly selected online residence duration, in seconds (minimum 30).
# Party/alliance membership defers departure. Combat, casts, death and visibility
# do not extend an expired timer. Native cancellation/saving and custody guards apply.
gameserver.playerbots.population.presence_min_seconds = 600
# Longest online residence duration, in seconds; >= presence_min_seconds.
# 28800 seconds = 8 hours. Only controls timed departure when periodic_presence=true.
gameserver.playerbots.population.presence_max_seconds = 28800
# Optional extra random offline break after timed departure. False matches the
# pinned WoW expiry path, which does not assign a new offline timer on that path.
# True uses the two duration settings below. Previously saved breaks are always
# honored until their actual expiry; disabling never erases an existing deadline.
gameserver.playerbots.population.offline_cooldown.enable = false
# Shortest random offline cooldown before a departed global character can return,
# in seconds (minimum 30), when offline_cooldown.enable=true. Saved breaks survive restarts.
gameserver.playerbots.population.offline_min_seconds = 600
# Longest offline cooldown, in seconds; >= offline_min_seconds. 28800 = 8 hours.
# Returning bots reuse the same native character ID, gear and earned progress.
gameserver.playerbots.population.offline_max_seconds = 28800
# Shortest interval before choosing another target between population.min and max,
# in seconds (minimum 30). 1800 = 30 minutes; not the creation/AI tick interval.
gameserver.playerbots.population.target_min_seconds = 1800
# Longest interval between target selections, in seconds; >= target_min_seconds.
# 7200 = 2 hours. A persisted target is reused until expiry unless outside new bounds.
gameserver.playerbots.population.target_max_seconds = 7200

# WORLD PLACEMENT AND SAFE RELOCATION
# Shortest scheduled idle relocation interval, in seconds (minimum 30).
# 3600 = 1 hour. Earned level changes can also trigger eligible relocation.
gameserver.playerbots.population.teleport_min_seconds = 3600
# Longest scheduled relocation interval, in seconds; >= teleport_min_seconds.
# 18000 = 5 hours. Combat, player proximity and native landing checks can defer it.
gameserver.playerbots.population.teleport_max_seconds = 18000
# Chance (0-100%) to prefer a city/hub destination rather than a field destination.
# This is a placement preference, not a guaranteed percentage of all visible bots.
# 0 places new/recovering residents at monster camps; existing actors relocate safely.
gameserver.playerbots.population.city_percent = 0
# Prefer field destinations in occupied real-player native map/zone pairs, while
# retaining faction/level/ground safety and worldwide fallback. Covers both factions.
# Visible staff count; hidden observers and instance players do not. City chance is separate.
gameserver.playerbots.population.concentrate_player_maps = true
# Respond to real-player map/area changes at the next bounded maintenance poll.
# Unseen idle global bots elsewhere are moved/reused or saved offline, without deleting
# characters. Party-controlled/manual bots, combat/trade/custody and the 150m guard remain.
# With no eligible real player online, independent worldwide activity resumes normally.
gameserver.playerbots.population.player_focus.enable = true
# Retired setting, ignored regardless of its value. Player focus redistributes the
# complete configured global target across occupied maps; it does not cap population.
# Use population.min, population.max and world.max_active to set bot counts.
gameserver.playerbots.population.player_focus.per_map = 0
# Prefer actual native camps within this many metres of players (200..5000).
# The closest safe map camps remain fallback if the local area has none; destinations
# within 150m of any human remain forbidden. Bots keep their native faction/level.
gameserver.playerbots.population.player_focus.radius = 900
# Optional comma-separated NATIVE Aion open-world map IDs for global placement.
# Empty means every eligible native open-world map with a validated destination.
# Example: 210010000,220010000. Instances/ineligible faction or level areas remain excluded.
gameserver.playerbots.population.maps =
