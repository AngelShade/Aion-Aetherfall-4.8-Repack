# Playerbot native terrain planning. Restart GameServer after editing.
# These values do not alter bot populations, spells, movement speed or NPC AI.
# Final overrides may be supplied in config/mygs.properties.

# Use offline-generated ground navigation meshes from data/navmesh. Restart required.
# Missing/incompatible maps remain on native collision-based search and are reported.
# Native floor, body, door and hazard checks still decide actual movement.
gameserver.playerbots.navigation.mesh.enable = true

# Shared tile-window and journey-topology memory reservation, 64..4096 MB.
# It does not change the GameServer heap size. Windows load asynchronously
# on demand and are shared by bots; unpinned least-used windows can be evicted.
# This bounds mesh reservations, not total JVM memory or the number of bots.
gameserver.playerbots.navigation.mesh.memory_mb = 768

# Concurrent retained mesh searches, 1..256. Additional actors wait without
# allocating a search graph. Existing navigation time/worker limits still apply.
gameserver.playerbots.navigation.mesh.max_queries = 64

# Aggregate elapsed planning work admitted per second: 1..1000 milliseconds.
# 500 means approximately half of one core for budgeted searches, not half of
# the whole server's CPU. Ordinary movement, combat and other server work remain.
# Uninterruptible native probes can exceed a slice; their measured cost becomes
# debt and pauses later admission until paid. This is not a hard CPU limit within
# a single native probe. The burst allowance is only max_workers * slice_ms.
gameserver.playerbots.navigation.budget_ms_per_second = 500

# Maximum planned slice before yielding retained search work: 1..50 milliseconds.
# Native probes already in progress finish safely; pending paths remain retained.
gameserver.playerbots.navigation.slice_ms = 3

# Maximum concurrent budgeted terrain searches: 1..6. Higher values do not
# increase the aggregate work budget. Controlled/nearby combat is prioritized;
# aged background requests retain a share so independent world bots keep moving.
gameserver.playerbots.navigation.max_workers = 2

# Native-proved local path segment: 4..128 metres. The full quest/travel goal is
# retained; finishing a local segment never grants quest credit or means arrival.
# Each published edge and native mover step still validate terrain and hazards.
gameserver.playerbots.navigation.segment_metres = 24
