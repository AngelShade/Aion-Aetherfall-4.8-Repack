# Playerbot native terrain planning. Restart GameServer after editing.
# These values do not alter bot populations, spells, movement speed or NPC AI.
# Final overrides may be supplied in config/mygs.properties.

# Each bot keeps its own short planning slice. No shared terrain or query queue.
# Loaded map data and recorded paths are shared in RAM; ordinary AI workers remain bounded.
gameserver.playerbots.navigation.independent = true

# Prefer prepared maps and physically walked route recordings in RAM. Avoid the
# duplicate native corridor walk and expensive live-grid fallback. The native mover
# still checks every actual step. Failed ground steps feed shared learned-blocks.csv;
# reached paths feed learned-routes.csv. Both are map geometry, not character progress.
gameserver.playerbots.navigation.memory_first = true

# Use offline-generated ground navigation meshes from data/navmesh. Restart required.
# Missing/incompatible maps remain on native collision-based search and are reported.
# Native floor, body, door and hazard checks still decide actual movement.
gameserver.playerbots.navigation.mesh.enable = true

# Shared tile-window, journey-topology and cached-route allowance.
# 0 uses heap_percent of the maximum GameServer heap (minimum 64 MB).
# A positive value explicitly fixes this allowance in MB, below the JVM heap.
# There is no fixed multi-GB ceiling; keep room for actors, data and queries.
# It does not change the GameServer heap size. Windows load asynchronously
# on demand and are shared by bots; unpinned least-used windows can be evicted.
# This bounds mesh reservations, not total JVM memory or the number of bots.
gameserver.playerbots.navigation.mesh.memory_mb = 0
gameserver.playerbots.navigation.mesh.heap_percent = 25

# Successful immutable road itineraries reused across bots, per loaded map.
# 0 disables; nonnegative KiB. Included in the shared memory allowance above.
# Dynamic rejected arcs bypass it; live collision proof is never cached away.
gameserver.playerbots.navigation.mesh.route_cache_kb = 512

# Compatibility mode only (independent=false): retained mesh searches, 1..256. Additional actors wait without
# allocating a search graph. Existing navigation time/worker limits still apply.
gameserver.playerbots.navigation.mesh.max_queries = 64

# Compatibility mode only (independent=false): aggregate planning work per second, 1..1000 milliseconds.
# 500 means approximately half of one core for budgeted searches, not half of
# the whole server's CPU. Ordinary movement, combat and other server work remain.
# Uninterruptible native probes can exceed a slice; their measured cost becomes
# debt and pauses later admission until paid. This is not a hard CPU limit within
# a single native probe. The burst allowance is only max_workers * slice_ms.
gameserver.playerbots.navigation.budget_ms_per_second = 500

# Maximum planned slice before yielding retained search work: 1..50 milliseconds.
# Native probes already in progress finish safely; pending paths remain retained.
gameserver.playerbots.navigation.slice_ms = 3

# Compatibility mode only (independent=false): concurrent terrain searches, 1..6. Higher values do not
# increase the aggregate work budget. Controlled/nearby combat is prioritized;
# aged background requests retain a share so independent world bots keep moving.
gameserver.playerbots.navigation.max_workers = 2

# Native-proved local path segment: 4..128 metres. The full quest/travel goal is
# retained; finishing a local segment never grants quest credit or means arrival.
# Each published edge and native mover step still validate terrain and hazards.
gameserver.playerbots.navigation.segment_metres = 24

# Navmesh accuracy diagnostics: true/false. When true, the population log shows how
# many prepared routes passed or failed the native ground check, and every 5 minutes
# log/navmesh_areas-<run start>.csv lists pass/fail per map and 50 m area with one example.
# Turn off once the navmesh evaluation is finished; movement is unaffected either way.
gameserver.playerbots.navigation.mesh.diagnostics = true

# Learn blocked spots: true/false. Where a navmesh route fails the real-ground check,
# the spot is saved to data/navmesh/learned-blocks.csv and later routes go around it.
# Delete that file to forget all learned spots. Movement checks are unchanged.
gameserver.playerbots.navigation.mesh.learn_blocks = true

# Quick Detour line check on already loaded navmesh before the native straight-walk
# probe. A wall on the mesh sends the bot straight to route planning and saves the
# expensive ground-collision probe; an open line is still checked natively.
gameserver.playerbots.navigation.mesh.line_check = true
