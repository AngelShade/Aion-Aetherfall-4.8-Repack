# PLAYERBOTS ECONOMY MODULE
# Everything that moves Kinah, items or tickets for bots. Pricing reasoning: docs/ECONOMY_PRICING.md.
# The main switch stops bot market trading, world bot goals and goal hunts, world bot Pass buying and the
# help contract. Bots with market orders still close them when recycled. Hiring and recycling have their
# own switches below.
gameserver.playerbots.economy.enable = true

# EQUIPMENT ENHANCEMENT
# Companions still require their owner's Care enchant toggle; its saved default stays off.
# World bots use their own looted, extracted or purchased stones and native success/failure rules.
gameserver.playerbots.enhance.enabled = true
gameserver.playerbots.enhance.world = true
# Desired level, always limited by the item's native maximum. Failures can lose levels or destroy gear.
gameserver.playerbots.enhance.target_level = 10
# Daily stone allowance: this share of spare Kinah above the level/saved reserve when the day begins.
# The existing market and Care spending limits also apply; no owner's funds are used.
gameserver.playerbots.enhance.budget_percent = 15

# HIRING
# Explicit quoted hiring. Kinah goes from the human's cube to the world helper.
# Fee = max(minimum_kinah, level^2 * level_kinah) * combat-rank percentage / 100, rounded up.
# Poor/Ordinary/Good/Great/Excellent percentages; unranked actors use 100%.
# One fixed wall-clock term, no automatic renewal. Admission failure rolls back in full;
# once joined there is no refund. Disconnect/release ends control without refund.
gameserver.playerbots.hiring.enable = true
gameserver.playerbots.hiring.minimum_kinah = 1000
gameserver.playerbots.hiring.level_kinah = 50
gameserver.playerbots.hiring.rank_percent = 100,110,125,150,200
gameserver.playerbots.hiring.duration_minutes = 60
gameserver.playerbots.hiring.quote_seconds = 300

# RECYCLING
# Recycling is terminal and requires a review/confirmation. All three rewards commit together.
# Ticket credit stays literal 0.33. Native stored Kinah is archived, never paid back.
# Learning: rarity base + 25% actual-play learning + capped native item value / divisor;
# capped by learning_cap and recipient's remaining rank capacity. Received recycled XP never compounds.
# Kinah: rarity base + capped actual-play learning * rate + eligible native NPC item appraisal,
# capped by kinah_cap. Free catch-up/Stigmas, quest/temporary items and duplicate views add no value.
gameserver.playerbots.recycle.enable = true
gameserver.playerbots.recycle.learning_base = 25,50,100,250,500
gameserver.playerbots.recycle.kinah_base = 1000,2500,5000,10000,20000
gameserver.playerbots.recycle.learning_percent = 25
gameserver.playerbots.recycle.learning_cap = 5000
gameserver.playerbots.recycle.item_learning_divisor = 1000
gameserver.playerbots.recycle.item_learning_cap = 500000
gameserver.playerbots.recycle.kinah_cap = 1000000
gameserver.playerbots.recycle.actual_learning_cap = 20000
gameserver.playerbots.recycle.kinah_per_learning = 2
gameserver.playerbots.recycle.quote_seconds = 120

# BOT CENTRAL MARKET
# Ticket recruits, Temporary Bots and world bots buy and sell on the real Central Market with their own
# Kinah and items, kept apart from every human account. A bot never trades with its own owner or the
# owner's other bots. Generated catch-up gear and system Stigmas are never listed.
gameserver.playerbots.market.enable = true
# Seconds between one bot's trading visits, and the most market transactions all bots may run per minute.
gameserver.playerbots.market.interval_seconds = 900
gameserver.playerbots.market.operations_per_minute = 120
# Live orders per bot, and hours before an unfilled order is cancelled, settled and repriced on the next visit.
gameserver.playerbots.market.open_orders = 3
gameserver.playerbots.market.order_hours = 4
# reserve_kinah is a level-65 reference, scaled by level squared (minimum 1,000); saved Care reserve also applies.
# A purchase costs at most budget_percent of spare Kinah and obeys the bot's remaining Care daily budget.
gameserver.playerbots.market.reserve_kinah = 50000
# What a world bot may spend per day, as a level-65 reference scaled like reserve_kinah. Companions use their Care budget instead.
gameserver.playerbots.market.world_daily_kinah = 2000000
gameserver.playerbots.market.budget_percent = 25
# Stacked crafting materials above this count are surplus.
gameserver.playerbots.market.material_reserve = 200
# Price judgement. A price needs evidence_owners separate owners, read from at most evidence_trades trades
# of the last evidence_days days and evidence_orders orders per side; otherwise native value is used.
# Fair value stays between fair_minimum_percent and fair_maximum_percent of native value.
gameserver.playerbots.market.reserve_minimum = 1000
gameserver.playerbots.market.evidence_owners = 3
gameserver.playerbots.market.evidence_trades = 32
gameserver.playerbots.market.evidence_days = 7
gameserver.playerbots.market.evidence_orders = 16
gameserver.playerbots.market.fair_minimum_percent = 75
gameserver.playerbots.market.fair_maximum_percent = 125
# Buying: pay up to overpay_percent above fair value, or only drop_source_percent of it when a known source exists.
gameserver.playerbots.market.overpay_percent = 10
gameserver.playerbots.market.drop_source_percent = 80
# Selling: accept a bid of at least fair_bid_percent of fair value.
gameserver.playerbots.market.fair_bid_percent = 90
# Purchases and sales one visit may consider. The rest wait for the next visit.
gameserver.playerbots.market.needs_per_visit = 3
gameserver.playerbots.market.sales_per_visit = 3
# World bots also shop for gear they can wear now (not only their stage-end goal), using the
# same fair-price, budget and live-ask rules. Equipment admission is the one used to equip, so what
# they buy is worn when they next act near a player. upgrades_per_visit candidates are priced per
# visit; an item not bought is not priced again for upgrade_retry_hours. Companions are unaffected.
gameserver.playerbots.market.upgrades = true
gameserver.playerbots.market.upgrades_per_visit = 2
gameserver.playerbots.market.upgrade_retry_hours = 6

# WORLD BOT GOALS
# World bots work out the best verified gear for their stage, as companions do, every interval_seconds.
# With hunt on, a bot travels to a monster that drops a goal or an upgrade at most once per
# hunt_interval_seconds, ahead of its next quest step; its leaning shortens (hunter) or lengthens (quester) the wait. With help_requests on, a hard monster on its map becomes a Find Group help request.
gameserver.playerbots.worldgoals.enable = true
gameserver.playerbots.worldgoals.interval_seconds = 900
# Population-wide refresh starts per second (1-20); due bots retry on their next normal tick.
gameserver.playerbots.worldgoals.per_second = 2
gameserver.playerbots.worldgoals.hunt = true
gameserver.playerbots.worldgoals.hunt_interval_seconds = 1800
# Seconds a bot stays on its hunting ground fighting the monster it came for.
gameserver.playerbots.worldgoals.hunt_stay_seconds = 600
gameserver.playerbots.worldgoals.help_requests = true

# WORLD BOT PASS
# World bots buy their next Pass tier after earning a Pass level, when its price is at most budget_percent
# of spare Kinah. reserve_kinah is the level-65 reference; it scales with level squared (minimum 1,000),
# and the bot's saved care reserve still applies. Owned companions wait for their owner's choice.
gameserver.playerbots.pass.autonomous = true
gameserver.playerbots.pass.reserve_kinah = 200000
gameserver.playerbots.pass.budget_percent = 25

# HELP CONTRACT
# Help contract: every help_requests distinct finished bot requests pay help_amount tickets. 0 turns it off.
# The helper must take part through native damage/tanking/effective support near the objective.
gameserver.playerbots.tickets.help_requests = 1
gameserver.playerbots.tickets.help_amount = 1

# WORLD BOT PROFESSIONS
# Awake bots work physically; dormant bots use real native rules on the bounded worker.
# World professions; owned Focus and road careers retain their own policies.
gameserver.playerbots.professions.enable = true
# Native skill:weight. Only new world assignments are balanced.
gameserver.playerbots.professions.primary_weights = 30002:20,30003:10,40001:15,40002:10,40003:10,40004:10,40007:15,40008:8,40010:2
# name:weight:total holding limit:working reserve:sale lot. Cube plus private warehouse count.
gameserver.playerbots.professions.gatherer_styles = small_seller:25:200:20:25,regular:40:500:75:50,stockpiler:25:1000:250:100,hoarder:10:2000:750:100
# Saved preference, never a class/profession or party-order lock.
gameserver.playerbots.professions.crafter_styles = own_gear:30,skill_grinder:25,market_crafter:30,bulk_intermediates:15
# Shared bounded worker admission, including dormant market/warehouse work. No navigation.
gameserver.playerbots.professions.background_turns_per_second = 8
# Minimum dormant turn interval, plus per-character jitter.
gameserver.playerbots.professions.background_interval_seconds = 600
# Minimum time per background harvest, including travel allowance; native XP/output rates apply.
gameserver.playerbots.professions.gather_seconds = 60
# After training, learning a design or buying from a shop, the next background turn comes this soon. Those steps only prepare the real work.
gameserver.playerbots.professions.setup_retry_seconds = 60
# Most gathering attempts one background turn may catch up on. With a 600 second interval and 60 second attempts this is 60 attempts an hour per bot.
gameserver.playerbots.professions.background_gather_batch = 10
# Most craft attempts in one background turn, within the hourly practice limit.
gameserver.playerbots.professions.background_craft_batch = 3
# Awake independent work cooldown.
gameserver.playerbots.professions.work_interval_seconds = 900
# Maximum awake work slice, ending safely after native actions.
gameserver.playerbots.professions.work_slice_seconds = 180
# Maximum awake same-map trainer/workbench trip, then use the ledgered fallback.
gameserver.playerbots.professions.trip_seconds = 120
# No physical progress for this long also falls back; native pending routes may yield.
gameserver.playerbots.professions.trip_stall_seconds = 30
# Cached plan lifetime; inventory/skill/quest changes invalidate it.
gameserver.playerbots.professions.plan_refresh_seconds = 60
# Population-wide planning admission.
gameserver.playerbots.professions.plans_per_second = 4
# Maximum indexed recipe candidates per admitted plan.
gameserver.playerbots.professions.recipes_per_plan = 24
# Maximum indexed gathering candidates per plan.
gameserver.playerbots.professions.sources_per_plan = 32
# Maximum terminal acquisition dependencies.
gameserver.playerbots.professions.needs_per_plan = 8
# Failed/blocked recipe retry delay.
gameserver.playerbots.professions.retry_seconds = 300
# Consecutive failed attempts before backing off.
gameserver.playerbots.professions.failed_attempts = 3
# Speculative product stock in native recipe batches.
gameserver.playerbots.professions.product_stock_batches = 2
# Crafter input holding limit; gatherer limits come from saved styles.
gameserver.playerbots.professions.crafter_material_limit = 500
# Level-65 daily operating spend reference; never a credit.
gameserver.playerbots.professions.operating_daily_kinah = 500000
# Absolute daily native trainer fee allowance, from the bot wallet only.
gameserver.playerbots.professions.training_daily_kinah = 6500000
# Native paid rank upgrades per day.
gameserver.playerbots.professions.training_per_day = 1
# Level-65 daily practice loss reference, including owned input opportunity cost.
gameserver.playerbots.professions.skill_loss_daily_kinah = 50000
# Bounded practice attempts, success or failure.
gameserver.playerbots.professions.practice_attempts_per_hour = 12
# Stop zero-XP practice; useful production at a cap remains possible.
gameserver.playerbots.professions.zero_xp_completions = 2
# Minimum net expected margin after native market settlement.
gameserver.playerbots.professions.minimum_margin_percent = 10
# Planning assumption only; native craft rolls are unchanged.
gameserver.playerbots.professions.profit_success_percent = 75
# Per-character newly offered units per item; relisting does not reset the counter.
gameserver.playerbots.professions.sale_daily_units = 500
# Per-character equipment sale quantity per item per day.
gameserver.playerbots.professions.sale_gear_daily_units = 1
# Maximum new world offers per item per day and outstanding production exposure.
gameserver.playerbots.professions.world_item_units = 2000
# Bounded production evidence cache lifetime.
gameserver.playerbots.professions.market_snapshot_seconds = 300
# Maximum production quote reads per minute across the population.
gameserver.playerbots.professions.market_variants_per_minute = 60
# Bounded cached/requested production variants.
gameserver.playerbots.professions.market_cache_entries = 256
# Funded buy-order wait before physical/native source fallback.
gameserver.playerbots.professions.market_wait_seconds = 600
# Reserved setting; currently has no effect. Each saved assignment is counted once, when its bot is loaded.
gameserver.playerbots.professions.census_refresh_seconds = 900
