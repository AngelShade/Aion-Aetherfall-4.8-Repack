# Aion 4.8 NA / DXVK 3.1.1 / RTX 4060 quality and compatibility profile
# Read from the client root; the startup helper also sets an explicit config path.

# Preserve borderless behavior and Alt+Tab on Windows.
# Native UI cursor rendering is selected by QualityProfile.ps1.
dxvk.allowFse = False

# Aion compatibility recommendation: defer the initial Vulkan surface.
d3d9.deferSurfaceCreation = True

# Keep ground, armor and architecture textures clearer at oblique angles.
d3d9.samplerAnisotropy = 16

# Aion compatibility recommendation for legacy shader/sampler combinations.
d3d9.forceSamplerTypeSpecConstants = True

# Current DXVK handles buffer mapping automatically; no obsolete buffer override.
# Keep shader precision, LOD bias, Vsync, MSAA and frame limit under their defaults
# or the game's own controls. Do not trade correctness for speculative speed.

# Optional FPS display. Uncomment to enable it.
# dxvk.hud = fps
